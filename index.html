<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Integration Calculator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Math.js for safe mathematical expression parsing and evaluation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent page scrolling, handled by canvas */
            touch-action: none; /* Prevent default touch actions on mobile */
        }
        #canvas-container {
            cursor: grab;
        }
        #canvas-container:active {
            cursor: grabbing;
        }
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen bg-white text-gray-800 font-sans">

    <!-- Left Sidebar: Controls & Inputs -->
    <div class="w-full md:w-96 bg-gray-50 border-r border-gray-200 flex flex-col shadow-[4px_0_15px_rgba(0,0,0,0.05)] z-10 shrink-0 h-1/3 md:h-full transition-all duration-300">
        
        <div class="p-6 pb-2 border-b border-gray-200 bg-white">
            <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M12 3c-1.2 0-2.4.6-3 1.7A3.6 3.6 0 0 0 8.2 8c-.4 2.4-1.4 5.3-3.2 7A3.2 3.2 0 0 0 4 17.6c0 1.9 1.6 3.4 3.5 3.4 1.7 0 3-1.1 3.4-2.6.4-1.5.9-4.2 2-6.5C14 9.6 15.3 8 16.5 8c1.6 0 3 1.3 3 2.9 0 1.2-.6 2.4-1.7 3"/></svg>
                Integral Calculator
            </h1>
            <p class="text-sm text-gray-500 mt-1">Graph & calculate definite integrals</p>
        </div>

        <div class="p-6 flex-1 overflow-y-auto space-y-6">
            
            <!-- Function Input -->
            <div class="space-y-2">
                <label for="funcInput" class="block text-sm font-semibold text-gray-700">Function $f(x)$</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3 text-gray-500 italic font-serif">f(x) =</span>
                    <input type="text" id="funcInput" value="-x^2 + 4" 
                        class="w-full pl-12 pr-4 py-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-0 outline-none text-lg font-mono text-gray-800 transition-colors">
                </div>
                <p id="errorMsg" class="text-xs text-red-500 hidden">Invalid mathematical expression.</p>
            </div>

            <!-- Bounds Inputs -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-gray-700">Definite Integral Bounds</label>
                <div class="flex items-center gap-4">
                    <div class="flex-1 relative">
                        <span class="absolute left-3 top-2 text-gray-500 text-sm">Lower (a)</span>
                        <input type="number" id="aInput" value="-2" step="any"
                            class="w-full pt-6 pb-2 px-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-0 outline-none font-mono text-gray-800 transition-colors">
                    </div>
                    <span class="text-gray-400 font-bold">to</span>
                    <div class="flex-1 relative">
                        <span class="absolute left-3 top-2 text-gray-500 text-sm">Upper (b)</span>
                        <input type="number" id="bInput" value="2" step="any"
                            class="w-full pt-6 pb-2 px-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:ring-0 outline-none font-mono text-gray-800 transition-colors">
                    </div>
                </div>
            </div>

            <!-- Result Display -->
            <div class="bg-indigo-50 rounded-xl p-5 border border-indigo-100">
                <div class="text-sm font-medium text-indigo-800 mb-1">Result (Area)</div>
                <div id="resultDisplay" class="text-3xl font-bold text-indigo-600 font-mono tracking-tight">10.6667</div>
            </div>

        </div>
        
        <!-- Formula preview visually -->
        <div class="p-4 bg-gray-100 border-t border-gray-200 text-center text-sm font-serif text-gray-600 flex justify-center items-center gap-2">
            <span class="text-2xl font-light">∫</span>
            <div class="flex flex-col text-[10px] leading-tight text-left">
                <span id="previewB" class="font-bold">2</span>
                <span id="previewA" class="font-bold">-2</span>
            </div>
            <span id="previewF" class="text-base italic px-1">(-x^2 + 4)</span>
            <span class="text-base">dx</span>
            <span class="text-base mx-1">=</span>
            <span id="previewRes" class="text-base font-bold text-indigo-600">10.6667</span>
        </div>
    </div>

    <!-- Right Main Area: Graph Canvas -->
    <div class="flex-1 relative bg-white" id="canvas-container">
        <canvas id="graphCanvas"></canvas>
        
        <!-- Graph Controls -->
        <div class="absolute bottom-6 right-6 flex bg-white shadow-lg rounded-lg border border-gray-200 overflow-hidden">
            <button id="btnZoomIn" class="p-3 hover:bg-gray-100 text-gray-600 border-r border-gray-200 transition-colors" title="Zoom In">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button id="btnZoomOut" class="p-3 hover:bg-gray-100 text-gray-600 border-r border-gray-200 transition-colors" title="Zoom Out">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button id="btnReset" class="p-3 hover:bg-gray-100 text-gray-600 transition-colors flex items-center gap-1 font-semibold text-sm" title="Reset View">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Reset
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const funcInput = document.getElementById('funcInput');
        const aInput = document.getElementById('aInput');
        const bInput = document.getElementById('bInput');
        const resultDisplay = document.getElementById('resultDisplay');
        const errorMsg = document.getElementById('errorMsg');
        
        const previewA = document.getElementById('previewA');
        const previewB = document.getElementById('previewB');
        const previewF = document.getElementById('previewF');
        const previewRes = document.getElementById('previewRes');

        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // State Variables
        let expression = funcInput.value;
        let boundA = parseFloat(aInput.value);
        let boundB = parseFloat(bInput.value);
        let compiledFunc = null;
        let functionIsValid = true;

        // Viewport State (Camera)
        let pixelsPerUnit = 80;
        let centerX = 0; 
        let centerY = 0;
        
        // Panning State
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Initialize and Setup
        function init() {
            compileMath();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupEventListeners();
            updateAll();
        }

        // Handle Resizing
        function resizeCanvas() {
            // Support high DPI displays
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            ctx.scale(dpr, dpr);
            render();
        }

        // Math compilation
        function compileMath() {
            try {
                const node = math.parse(expression);
                compiledFunc = node.compile();
                // Test evaluation
                compiledFunc.evaluate({ x: 0 });
                functionIsValid = true;
                errorMsg.classList.add('hidden');
                funcInput.classList.remove('border-red-500', 'focus:border-red-500');
            } catch (err) {
                functionIsValid = false;
                errorMsg.classList.remove('hidden');
                funcInput.classList.add('border-red-500', 'focus:border-red-500');
            }
        }

        // Evaluate function safely
        function f(x) {
            if (!functionIsValid || !compiledFunc) return NaN;
            try {
                return compiledFunc.evaluate({ x: x });
            } catch (e) {
                return NaN;
            }
        }

        // Numerical Integration: Simpson's 1/3 Rule
        function integrate(a, b) {
            if (!functionIsValid) return NaN;
            if (a === b) return 0;
            
            // Swap bounds if a > b and negate result later
            const reversed = a > b;
            if (reversed) {
                let temp = a; a = b; b = temp;
            }

            const n = 1000; // Must be even
            const h = (b - a) / n;
            let sum = f(a) + f(b);

            for (let i = 1; i < n; i += 2) {
                sum += 4 * f(a + i * h);
            }
            for (let i = 2; i < n - 1; i += 2) {
                sum += 2 * f(a + i * h);
            }

            let result = (h / 3) * sum;
            return reversed ? -result : result;
        }

        // Update calculations and UI
        function updateAll() {
            expression = funcInput.value;
            boundA = parseFloat(aInput.value);
            boundB = parseFloat(bInput.value);
            
            if (isNaN(boundA)) boundA = 0;
            if (isNaN(boundB)) boundB = 0;

            compileMath();

            if (functionIsValid) {
                const area = integrate(boundA, boundB);
                const displayVal = isNaN(area) ? "Undefined" : parseFloat(area.toFixed(6)).toString();
                
                resultDisplay.innerText = displayVal;
                
                // Update formula preview
                previewA.innerText = boundA;
                previewB.innerText = boundB;
                previewF.innerText = `(${expression})`;
                previewRes.innerText = displayVal;
            } else {
                resultDisplay.innerText = "Error";
                previewRes.innerText = "Error";
            }

            render();
        }

        // Coordinate Conversions
        function mathToPx(x, y) {
            const rect = canvas.getBoundingClientRect();
            return {
                px: (rect.width / 2) + (x - centerX) * pixelsPerUnit,
                py: (rect.height / 2) - (y - centerY) * pixelsPerUnit
            };
        }

        function pxToMath(px, py) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: centerX + (px - rect.width / 2) / pixelsPerUnit,
                y: centerY - (py - rect.height / 2) / pixelsPerUnit
            };
        }

        // Rendering Engine
        function render() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            // Clear Canvas
            ctx.clearRect(0, 0, width, height);

            // Determine visible math range
            const topLeft = pxToMath(0, 0);
            const bottomRight = pxToMath(width, height);
            
            const xMin = topLeft.x;
            const xMax = bottomRight.x;
            const yMin = bottomRight.y; // Y is inverted in screen space
            const yMax = topLeft.y;

            drawGrid(xMin, xMax, yMin, yMax, width, height);
            drawAxes(xMin, xMax, yMin, yMax, width, height);
            
            if (functionIsValid) {
                drawIntegralArea(xMin, xMax);
                drawFunctionCurve(xMin, xMax, width);
            }
        }

        // Calculate appropriate grid step based on zoom level
        function getGridStep() {
            // Target ~100 pixels between grid lines
            const unitsPer100Px = 100 / pixelsPerUnit;
            // Find nearest nice power of 10 or 2,5 multiple
            const exponent = Math.floor(Math.log10(unitsPer100Px));
            const magnitude = Math.pow(10, exponent);
            const normalized = unitsPer100Px / magnitude;

            let step;
            if (normalized < 2) step = 1;
            else if (normalized < 5) step = 2;
            else step = 5;

            return step * magnitude;
        }

        function drawGrid(xMin, xMax, yMin, yMax, width, height) {
            const step = getGridStep();
            
            ctx.beginPath();
            ctx.strokeStyle = '#e5e7eb'; // tailwind gray-200
            ctx.lineWidth = 1;

            // Vertical lines
            let startX = Math.floor(xMin / step) * step;
            for (let x = startX; x <= xMax; x += step) {
                let px = mathToPx(x, 0).px;
                ctx.moveTo(px, 0);
                ctx.lineTo(px, height);
            }

            // Horizontal lines
            let startY = Math.floor(yMin / step) * step;
            for (let y = startY; y <= yMax; y += step) {
                let py = mathToPx(0, y).py;
                ctx.moveTo(0, py);
                ctx.lineTo(width, py);
            }
            ctx.stroke();

            // Draw Labels
            ctx.fillStyle = '#9ca3af'; // gray-400
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            
            for (let x = startX; x <= xMax; x += step) {
                if (Math.abs(x) > 0.0001) { // Skip 0
                    let pt = mathToPx(x, 0);
                    // clamp Y to screen
                    let labelY = Math.max(2, Math.min(pt.py + 4, height - 16));
                    ctx.fillText(parseFloat(x.toPrecision(12)).toString(), pt.px, labelY);
                }
            }

            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let y = startY; y <= yMax; y += step) {
                if (Math.abs(y) > 0.0001) { // Skip 0
                    let pt = mathToPx(0, y);
                    let labelX = Math.max(24, Math.min(pt.px - 6, width - 4));
                    ctx.fillText(parseFloat(y.toPrecision(12)).toString(), labelX, pt.py);
                }
            }
        }

        function drawAxes(xMin, xMax, yMin, yMax, width, height) {
            ctx.beginPath();
            ctx.strokeStyle = '#6b7280'; // gray-500
            ctx.lineWidth = 2;

            // X Axis
            let origin = mathToPx(0, 0);
            if (origin.py >= 0 && origin.py <= height) {
                ctx.moveTo(0, origin.py);
                ctx.lineTo(width, origin.py);
            }

            // Y Axis
            if (origin.px >= 0 && origin.px <= width) {
                ctx.moveTo(origin.px, 0);
                ctx.lineTo(origin.px, height);
            }
            ctx.stroke();
        }

        function drawIntegralArea(xMin, xMax) {
            let start = Math.min(boundA, boundB);
            let end = Math.max(boundA, boundB);

            // Optimization: If area is completely off-screen, skip
            if (end < xMin || start > xMax) return;

            // Clamp rendering to visible area to prevent huge paths
            start = Math.max(start, xMin);
            end = Math.min(end, xMax);

            if (start >= end) return;

            ctx.beginPath();
            // Start at bottom of left bound
            const startPt = mathToPx(start, 0);
            ctx.moveTo(startPt.px, startPt.py);

            // Curve to top of left bound and follow function
            const stepPx = 1; // 1 pixel step for smooth curve
            const mathStep = stepPx / pixelsPerUnit;

            for (let x = start; x <= end; x += mathStep) {
                let y = f(x);
                if (isNaN(y) || !isFinite(y)) continue;
                let pt = mathToPx(x, y);
                ctx.lineTo(pt.px, pt.py);
            }

            // End at bottom of right bound
            let endPtMath = mathToPx(end, f(end));
            ctx.lineTo(endPtMath.px, endPtMath.py); // Ensure it connects to final point exactly
            
            let bottomEndPt = mathToPx(end, 0);
            ctx.lineTo(bottomEndPt.px, bottomEndPt.py);

            ctx.closePath();
            
            // Fill Area (Indigo, Semi-transparent)
            ctx.fillStyle = 'rgba(79, 70, 229, 0.25)';
            ctx.fill();

            // Draw bounding lines (verticals)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(79, 70, 229, 0.8)';
            ctx.lineWidth = 2;
            
            let origStartPt = mathToPx(boundA, 0);
            let funcStartPt = mathToPx(boundA, f(boundA));
            if (boundA >= xMin && boundA <= xMax && isFinite(f(boundA))) {
                ctx.moveTo(origStartPt.px, origStartPt.py);
                ctx.lineTo(funcStartPt.px, funcStartPt.py);
            }

            let origEndPt = mathToPx(boundB, 0);
            let funcEndPt = mathToPx(boundB, f(boundB));
            if (boundB >= xMin && boundB <= xMax && isFinite(f(boundB))) {
                ctx.moveTo(origEndPt.px, origEndPt.py);
                ctx.lineTo(funcEndPt.px, funcEndPt.py);
            }
            ctx.stroke();
        }

        function drawFunctionCurve(xMin, xMax, widthPx) {
            ctx.beginPath();
            ctx.strokeStyle = '#4f46e5'; // Indigo-600
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';

            const step = (xMax - xMin) / widthPx; // Evaluate once per pixel
            let isDrawing = false;

            for (let x = xMin; x <= xMax; x += step) {
                let y = f(x);
                
                // Handle asymptotes and undefined regions
                if (isNaN(y) || !isFinite(y) || Math.abs(y) > 1e6) {
                    isDrawing = false;
                    continue;
                }

                let pt = mathToPx(x, y);
                
                if (!isDrawing) {
                    ctx.moveTo(pt.px, pt.py);
                    isDrawing = true;
                } else {
                    ctx.lineTo(pt.px, pt.py);
                }
            }
            
            ctx.stroke();
        }

        // Interactive Event Listeners
        function setupEventListeners() {
            // Inputs
            funcInput.addEventListener('input', updateAll);
            aInput.addEventListener('input', updateAll);
            bInput.addEventListener('input', updateAll);

            // Panning (Mouse)
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                
                centerX -= dx / pixelsPerUnit;
                centerY += dy / pixelsPerUnit; // + because Y is inverted
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                render();
            });

            // Panning (Touch)
            let lastTouchDistance = null;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    lastTouchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, {passive: false});

            container.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Prevent scrolling
                if (isDragging && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - lastMouseX;
                    const dy = e.touches[0].clientY - lastMouseY;
                    
                    centerX -= dx / pixelsPerUnit;
                    centerY += dy / pixelsPerUnit;
                    
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                    render();
                } else if (e.touches.length === 2 && lastTouchDistance !== null) {
                    // Pinch to zoom
                    const currentDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    
                    const zoomFactor = currentDistance / lastTouchDistance;
                    pixelsPerUnit *= zoomFactor;
                    
                    // Clamp zoom
                    pixelsPerUnit = Math.max(5, Math.min(1000, pixelsPerUnit));
                    
                    lastTouchDistance = currentDistance;
                    render();
                }
            }, {passive: false});

            container.addEventListener('touchend', () => {
                isDragging = false;
                lastTouchDistance = null;
            });

            // Zooming (Mouse Wheel)
            container.addEventListener('wheel', (e) => {
                e.preventDefault(); // Prevent page scroll
                const rect = container.getBoundingClientRect();
                
                // Get mouse pos in math coordinates before zoom
                const mousePx = e.clientX - rect.left;
                const mousePy = e.clientY - rect.top;
                const mathBefore = pxToMath(mousePx, mousePy);

                // Zoom
                const zoomIntensity = 0.1;
                const zoomFactor = e.deltaY < 0 ? (1 + zoomIntensity) : (1 - zoomIntensity);
                pixelsPerUnit *= zoomFactor;
                
                // Clamp zoom limits
                pixelsPerUnit = Math.max(5, Math.min(1000, pixelsPerUnit));

                // Adjust centerX/Y so the point under mouse remains in the same place
                const mathAfter = pxToMath(mousePx, mousePy);
                centerX -= (mathAfter.x - mathBefore.x);
                centerY -= (mathAfter.y - mathBefore.y);

                render();
            }, {passive: false});

            // Buttons
            document.getElementById('btnZoomIn').addEventListener('click', () => {
                pixelsPerUnit *= 1.5;
                pixelsPerUnit = Math.min(1000, pixelsPerUnit);
                render();
            });
            
            document.getElementById('btnZoomOut').addEventListener('click', () => {
                pixelsPerUnit /= 1.5;
                pixelsPerUnit = Math.max(5, pixelsPerUnit);
                render();
            });
            
            document.getElementById('btnReset').addEventListener('click', () => {
                centerX = 0;
                centerY = 0;
                pixelsPerUnit = 80;
                render();
            });
        }

        // Run
        init();

    </script>
</body>
</html>
